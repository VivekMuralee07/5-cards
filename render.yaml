# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: five-cards
    runtime: node
    plan: free              # change to "starter" to stop the server from sleeping
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
